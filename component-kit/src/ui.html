<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --bg-subtle: #f6f6f7;
    --card-bg: #fafafa;
    --text: #17171a;
    --text-muted: #6f6f75;
    --border: #e8e8ea;
    --accent: #4a5aff;
    --accent-soft: #eceeff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #232325;
      --bg-subtle: #1c1c1e;
      --card-bg: #2a2a2d;
      --text: #f1f1f2;
      --text-muted: #a3a3a7;
      --border: #38383b;
      --accent: #8b93ff;
      --accent-soft: #2a2b4d;
    }
  }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0; color: var(--text); background: var(--bg);
    display: flex; flex-direction: column;
  }

  .header {
    padding: 16px 18px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .brand-mark {
    width: 22px; height: 22px; border-radius: 6px; background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 12px; font-weight: 800;
  }
  .brand-name { font-size: 14px; font-weight: 700; }

  .search {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg-subtle); color: var(--text); font-size: 13px; outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .categories {
    display: flex; gap: 6px; padding: 10px 18px; overflow-x: auto; flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .cat-btn {
    flex-shrink: 0; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-subtle); color: var(--text-muted); cursor: pointer;
  }
  .cat-btn.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  .grid {
    flex: 1; overflow-y: auto; padding: 14px; display: grid;
    grid-template-columns: 1fr 1fr; gap: 12px; align-content: start;
  }

  .card {
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--card-bg);
    cursor: pointer; transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }

  .preview {
    height: 84px; display: flex; align-items: center; justify-content: center; padding: 10px;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .preview svg { width: 100%; height: 100%; }

  .card-footer {
    padding: 9px 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .card-name { font-size: 12px; font-weight: 600; }
  .insert-hint {
    font-size: 10px; font-weight: 700; color: var(--accent); opacity: 0; transition: opacity 0.12s ease;
  }
  .card:hover .insert-hint { opacity: 1; }

  .empty { grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 50px; }

  .toast {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg); font-size: 12px; font-weight: 600;
    padding: 8px 14px; border-radius: 8px; opacity: 0; pointer-events: none; transition: all 0.15s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-mark">CK</div>
      <div class="brand-name">Component Kit</div>
    </div>
    <input class="search" id="search" placeholder="Search components…" />
  </div>

  <div class="categories" id="categories"></div>
  <div class="grid" id="grid"></div>
  <div class="toast" id="toast"></div>

<script>
  const stroke = "var(--border)";
  const accent = "#4a5aff";
  const ink = "#1a1a1c";
  const mut = "#b8b8bc";

  const COMPONENTS = [
    {
      id: "hero", name: "Hero", category: "Sections",
      preview: `<svg viewBox="0 0 200 84"><rect width="200" height="84" fill="none"/>
        <rect x="70" y="14" width="60" height="4" rx="2" fill="${accent}"/>
        <rect x="40" y="26" width="120" height="8" rx="2" fill="${ink}"/>
        <rect x="55" y="40" width="90" height="6" rx="2" fill="${mut}"/>
        <rect x="75" y="56" width="50" height="16" rx="8" fill="${accent}"/>
      </svg>`
    },
    {
      id: "navbar", name: "Navbar", category: "Navigation",
      preview: `<svg viewBox="0 0 200 84"><rect x="10" y="30" width="180" height="24" rx="6" fill="none" stroke="${stroke}"/>
        <rect x="20" y="38" width="30" height="8" rx="2" fill="${ink}"/>
        <rect x="80" y="40" width="20" height="4" rx="2" fill="${mut}"/>
        <rect x="108" y="40" width="20" height="4" rx="2" fill="${mut}"/>
        <rect x="150" y="37" width="30" height="10" rx="5" fill="${accent}"/>
      </svg>`
    },
    {
      id: "pricing-card", name: "Pricing Card", category: "Cards",
      preview: `<svg viewBox="0 0 200 84"><rect x="60" y="6" width="80" height="72" rx="8" fill="none" stroke="${stroke}"/>
        <rect x="70" y="16" width="20" height="5" rx="2" fill="${accent}"/>
        <rect x="70" y="26" width="40" height="12" rx="2" fill="${ink}"/>
        <rect x="70" y="46" width="45" height="4" rx="2" fill="${mut}"/>
        <rect x="70" y="54" width="45" height="4" rx="2" fill="${mut}"/>
        <rect x="70" y="64" width="60" height="10" rx="5" fill="${accent}"/>
      </svg>`
    },
    {
      id: "testimonial", name: "Testimonial", category: "Sections",
      preview: `<svg viewBox="0 0 200 84"><rect x="30" y="8" width="140" height="68" rx="10" fill="none" stroke="${stroke}"/>
        <rect x="42" y="20" width="116" height="5" rx="2" fill="${mut}"/>
        <rect x="42" y="30" width="90" height="5" rx="2" fill="${mut}"/>
        <circle cx="52" cy="58" r="8" fill="${accent}" opacity="0.35"/>
        <rect x="66" y="54" width="40" height="4" rx="2" fill="${ink}"/>
        <rect x="66" y="61" width="55" height="4" rx="2" fill="${mut}"/>
      </svg>`
    },
    {
      id: "feature-card", name: "Feature Card", category: "Cards",
      preview: `<svg viewBox="0 0 200 84"><rect x="55" y="10" width="90" height="64" rx="8" fill="none" stroke="${stroke}"/>
        <rect x="65" y="20" width="18" height="18" rx="5" fill="${accent}" opacity="0.35"/>
        <rect x="65" y="46" width="50" height="6" rx="2" fill="${ink}"/>
        <rect x="65" y="56" width="65" height="4" rx="2" fill="${mut}"/>
        <rect x="65" y="63" width="55" height="4" rx="2" fill="${mut}"/>
      </svg>`
    },
    {
      id: "cta-banner", name: "CTA Banner", category: "Sections",
      preview: `<svg viewBox="0 0 200 84"><rect x="20" y="24" width="160" height="36" rx="8" fill="${ink}"/>
        <rect x="32" y="35" width="60" height="6" rx="2" fill="white"/>
        <rect x="32" y="44" width="80" height="4" rx="2" fill="${mut}"/>
        <rect x="140" y="34" width="30" height="16" rx="8" fill="white"/>
      </svg>`
    },
    {
      id: "footer", name: "Footer", category: "Navigation",
      preview: `<svg viewBox="0 0 200 84">
        <rect x="20" y="12" width="24" height="4" rx="2" fill="${ink}"/>
        <rect x="20" y="20" width="18" height="3" rx="1.5" fill="${mut}"/>
        <rect x="20" y="26" width="18" height="3" rx="1.5" fill="${mut}"/>
        <rect x="90" y="12" width="24" height="4" rx="2" fill="${ink}"/>
        <rect x="90" y="20" width="18" height="3" rx="1.5" fill="${mut}"/>
        <rect x="90" y="26" width="18" height="3" rx="1.5" fill="${mut}"/>
        <rect x="160" y="12" width="20" height="4" rx="2" fill="${ink}"/>
        <rect x="160" y="20" width="16" height="3" rx="1.5" fill="${mut}"/>
        <line x1="20" y1="48" x2="180" y2="48" stroke="${stroke}"/>
        <rect x="20" y="58" width="50" height="4" rx="2" fill="${mut}"/>
        <rect x="140" y="58" width="40" height="4" rx="2" fill="${mut}"/>
      </svg>`
    },
    {
      id: "stats-row", name: "Stats Row", category: "Sections",
      preview: `<svg viewBox="0 0 200 84">
        ${[35, 100, 165].map((x) => `
          <rect x="${x - 20}" y="30" width="40" height="10" rx="2" fill="${ink}"/>
          <rect x="${x - 15}" y="46" width="30" height="4" rx="2" fill="${mut}"/>
        `).join("")}
      </svg>`
    },
  ];

  const CATEGORIES = ["All", ...Array.from(new Set(COMPONENTS.map((c) => c.category)))];
  let activeCategory = "All";
  let searchTerm = "";

  const categoriesEl = document.getElementById("categories");
  categoriesEl.innerHTML = CATEGORIES.map((c) =>
    `<button class="cat-btn ${c === "All" ? "active" : ""}" data-cat="${c}">${c}</button>`
  ).join("");

  categoriesEl.querySelectorAll(".cat-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      categoriesEl.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      activeCategory = btn.dataset.cat;
      render();
    });
  });

  document.getElementById("search").addEventListener("input", (e) => {
    searchTerm = e.target.value.toLowerCase();
    render();
  });

  function render() {
    const grid = document.getElementById("grid");
    const items = COMPONENTS.filter((c) => {
      const matchesCat = activeCategory === "All" || c.category === activeCategory;
      const matchesSearch = c.name.toLowerCase().includes(searchTerm);
      return matchesCat && matchesSearch;
    });

    if (items.length === 0) {
      grid.innerHTML = '<div class="empty">No components match your search.</div>';
      return;
    }

    grid.innerHTML = items.map((c) => `
      <div class="card" data-id="${c.id}">
        <div class="preview">${c.preview}</div>
        <div class="card-footer">
          <span class="card-name">${c.name}</span>
          <span class="insert-hint">Insert →</span>
        </div>
      </div>
    `).join("");

    grid.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => {
        parent.postMessage({ pluginMessage: { type: "insert", id: card.dataset.id } }, "*");
        showToast("Inserted onto canvas");
      });
    });
  }

  let toastTimer;
  function showToast(text) {
    const toast = document.getElementById("toast");
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  }

  render();
</script>
</body>
</html>
