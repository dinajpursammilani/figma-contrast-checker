<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    margin: 0;
    padding: 16px;
    color: #1a1a1a;
    background: #fff;
  }
  .empty { color: #888; font-size: 12px; text-align: center; margin-top: 40px; }
  .ratio { font-size: 40px; font-weight: 700; text-align: center; margin: 4px 0; }
  .swatches { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .swatch { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .dot { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
  .checks { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .check { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 6px 10px; border-radius: 6px; background: #f5f5f5; }
  .pass { color: #0f8a3f; font-weight: 600; }
  .fail { color: #d92d20; font-weight: 600; }
  .error { color: #d92d20; font-size: 12px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>
  <div id="app"><div class="empty">Select two layers with solid fills to compare contrast.</div></div>

<script>
  const app = document.getElementById("app");

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === "error") {
      app.innerHTML = '<div class="error">' + msg.message + '</div>';
      return;
    }

    if (msg.type === "result") {
      app.innerHTML = `
        <div class="swatches">
          <div class="swatch"><span class="dot" style="background:${msg.hexA}"></span>${msg.hexA}</div>
          <div class="swatch"><span class="dot" style="background:${msg.hexB}"></span>${msg.hexB}</div>
        </div>
        <div class="ratio">${msg.ratio}:1</div>
        <div class="checks">
          <div class="check"><span>AA — normal text</span><span class="${msg.aaNormal ? 'pass' : 'fail'}">${msg.aaNormal ? 'Pass' : 'Fail'}</span></div>
          <div class="check"><span>AA — large text</span><span class="${msg.aaLarge ? 'pass' : 'fail'}">${msg.aaLarge ? 'Pass' : 'Fail'}</span></div>
          <div class="check"><span>AAA — normal text</span><span class="${msg.aaaNormal ? 'pass' : 'fail'}">${msg.aaaNormal ? 'Pass' : 'Fail'}</span></div>
        </div>
      `;
    }
  };
</script>
</body>
</html>
